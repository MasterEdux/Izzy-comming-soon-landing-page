# izzy.com.gt y www.izzy.com.gt -> landing
server {
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
}

# social.izzy.com.gt -> link en bio
server {
    listen 80;
    server_name social.izzy.com.gt;
    root /usr/share/nginx/html/social;
    index index.html;

    location ~ ^/favicon\.(svg|png|ico)$ {
        root /usr/share/nginx/html;
    }
}
